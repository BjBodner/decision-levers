[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-levers"
version = "0.1.0"
description = "Information, not instructions: tested prompting levers for typed decision models (TypeSafe Jev API). Independent project, not affiliated with TypeSafe."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Benjamin Jacob Bodner" }]
keywords = ["decision model", "classification", "prompting", "retrieval", "evaluation", "jev"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "scikit-learn>=1.2", "httpx>=0.24"]

[project.optional-dependencies]
dense = ["fastembed>=0.3"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/BjBodner/decision-levers"
Issues = "https://github.com/BjBodner/decision-levers/issues"

[tool.setuptools.packages.find]
include = ["decision_levers*"]

[tool.setuptools.package-data]
decision_levers = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
